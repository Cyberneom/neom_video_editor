name: neom_video_editor
description: Video Editor Functionalities for Open Neom.
version: 1.2.0
homepage: https://github.com/Cyberneom/neom_video_editor
publish_to: 'none'

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  neom_core:
    git:
      url: git@github.com:Open-Neom/neom_core.git
  neom_commons:
    git:
      url: git@github.com:Open-Neom/neom_commons.git

  crypto: ^3.0.6
  fraction: ^5.0.5
  video_editor: ^3.0.0
  easy_video_editor: ^0.1.2
  pro_video_editor:
    git:
      url: git@github.com:Open-Neom/neom_craft_workspace.git
      path: vendor/pro_video_editor

  video_compress: ^3.1.4
  web: ^1.1.1
  video_player: ^2.14.0
  file_picker: ^11.0.3
  path_provider: ^2.1.5
  neom_craft_workspace:
    git:
      url: git@github.com:Open-Neom/neom_craft_workspace.git
  neom_media_recovery:
    git:
      url: git@github.com:Open-Neom/neom_media_recovery.git
  neom_craft_libs:
    git:
      url: git@github.com:Open-Neom/neom_craft_workspace.git
      path: packages/neom_craft_libs
  neom_filmcraft:
    git:
      url: git@github.com:Open-Neom/neom_craft_workspace.git
      path: packages/neom_filmcraft
  neom_effectcraft:
    git:
      url: git@github.com:Open-Neom/neom_craft_workspace.git
      path: packages/neom_effectcraft

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/web/neom_video_export.bundle.js
    - assets/web/MEDIABUNNY_LICENSE
    - assets/web/THIRD_PARTY_NOTICES.txt
